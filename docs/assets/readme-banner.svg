<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title description">
  <title id="title">Google Drive Markdown Gateway</title>
  <desc id="description">One folder. Shared context. A gateway connecting AI tools to Markdown documents in Google Drive.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#050806"/>
      <stop offset=".55" stop-color="#080d0a"/>
      <stop offset="1" stop-color="#0e1410"/>
    </linearGradient>
    <linearGradient id="accent" x2="1" y2="1">
      <stop stop-color="#c6a36d"/>
      <stop offset="1" stop-color="#f4dfbb"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#c6a36d" stroke-opacity=".055"/>
    </pattern>
  </defs>
  <rect width="1280" height="420" rx="24" fill="url(#background)"/>
  <rect width="1280" height="420" rx="24" fill="url(#grid)"/>
  <circle cx="1132" cy="210" r="176" fill="none" stroke="#c6a36d" stroke-opacity=".07"/>
  <circle cx="1132" cy="210" r="143" fill="none" stroke="#c6a36d" stroke-opacity=".07"/>
  <path d="M0 395H1280" stroke="#c6a36d" stroke-opacity=".12"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="56" y="49" width="248" height="28" rx="14" fill="#0c110e" stroke="#c6a36d" stroke-opacity=".3"/>
    <circle cx="73" cy="63" r="4" fill="#c6a36d"/>
    <text x="86" y="68" font-size="11" font-weight="700" letter-spacing="1.7" fill="#ead4ad">YOUR FILES. YOUR CONTEXT.</text>
    <text x="56" y="148" font-size="47" font-weight="700" letter-spacing="-1.6" fill="#f4dfbb">Google Drive</text>
    <text x="56" y="207" font-size="47" font-weight="700" letter-spacing="-1.6" fill="url(#accent)">Markdown Gateway</text>
    <text x="58" y="257" font-size="23" fill="#f3f5ef" fill-opacity=".78">One folder. Shared context.</text>
    <text x="58" y="290" font-size="16" fill="#f3f5ef" fill-opacity=".64">Markdown in Drive. Connected to the tools you build with.</text>
    <g font-size="12" font-weight="700" letter-spacing="1.2" fill="#f3f5ef" fill-opacity=".64">
      <text x="58" y="358">MCP + JSON API</text>
      <circle cx="213" cy="353" r="2" fill="#c6a36d"/>
      <text x="234" y="358">CHECKED WRITES</text>
      <circle cx="387" cy="353" r="2" fill="#c6a36d"/>
      <text x="408" y="358">FOLDER SCOPED</text>
    </g>
    <!-- Two clients converge at a gateway, leading to a Markdown folder. -->
    <g fill="none" stroke="#c6a36d" stroke-opacity=".3" stroke-width="2">
      <path d="M837 132H867Q886 132 886 151V191Q886 210 905 210H930"/>
      <path d="M837 287H867Q886 287 886 268V229Q886 210 905 210"/>
      <path d="M1010 210H1058" stroke="#c6a36d" stroke-opacity=".88"/>
    </g>
    <circle cx="869" cy="133" r="4" fill="#c6a36d"/>
    <circle cx="870" cy="286" r="4" fill="#c6a36d"/>
    <circle cx="1038" cy="210" r="4" fill="#f4dfbb"/>
    <g>
      <rect x="687" y="91" width="150" height="82" rx="14" fill="#0c110e" stroke="#c6a36d" stroke-opacity=".24"/>
      <path d="M705 113H722M705 119H716" stroke="#c6a36d" stroke-width="2" stroke-linecap="round"/>
      <text x="706" y="148" font-size="17" fill="#f3f5ef" fill-opacity=".78">ChatGPT Work</text>
      <rect x="687" y="246" width="150" height="82" rx="14" fill="#0c110e" stroke="#c6a36d" stroke-opacity=".24"/>
      <path d="m707 264 6 5-6 5m12 0h9" fill="none" stroke="#c6a36d" stroke-width="2" stroke-linecap="round"/>
      <text x="706" y="304" font-size="17" fill="#f3f5ef" fill-opacity=".78">Codex / CLI</text>
    </g>
    <rect x="930" y="166" width="80" height="88" rx="19" fill="#242116" stroke="#c6a36d" stroke-opacity=".88" stroke-width="1.5"/>
    <path d="M952 230V197Q952 183 970 183Q988 183 988 197V230M961 230V199Q961 193 970 193Q979 193 979 199V230" fill="none" stroke="#ead4ad" stroke-width="3" stroke-linecap="round"/>
    <text x="970" y="281" text-anchor="middle" font-size="12" letter-spacing="1.2" fill="#f3f5ef" fill-opacity=".64">GATEWAY</text>
    <path d="M1060 168Q1060 160 1068 160H1100L1112 174H1196Q1204 174 1204 182V254Q1204 262 1196 262H1068Q1060 262 1060 254Z" fill="#0c110e" stroke="#c6a36d" stroke-opacity=".3" stroke-width="1.5"/>
    <path d="M1099 148H1140L1157 165V230H1099Z" fill="#f4dfbb"/>
    <path d="M1140 148V165H1157" fill="#c6a36d"/>
    <path d="M1060 195H1204V254Q1204 262 1196 262H1068Q1060 262 1060 254Z" fill="#242116" stroke="#c6a36d" stroke-opacity=".88" stroke-width="1.5"/>
    <text x="1132" y="236" text-anchor="middle" font-size="25" font-weight="700" font-family="monospace" fill="#ead4ad">.md</text>
    <text x="1132" y="291" text-anchor="middle" font-size="12" letter-spacing="1.2" fill="#f3f5ef" fill-opacity=".64">GOOGLE DRIVE</text>
  </g>
</svg>
